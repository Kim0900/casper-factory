name: Build GNSSKeeper APK

on:
  push:
    branches: [ main, 'fix/gnsskeeper-*' ]
    paths:
      - 'GNSSKeeper/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android API 36 (preinstalled runner SDK)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: GNSSKeeper
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNSSKeeper-debug-apk
          path: GNSSKeeper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
